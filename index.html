<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Symptom Checker & Reminder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans p-6">

    <div class="max-w-4xl mx-auto space-y-8">
        
        <!-- Header & Disclaimer -->
        <header class="text-center">
            <h1 class="text-3xl font-bold border-b-2 border-blue-500 inline-block pb-2">Medical Assistant Prototype</h1>
            <p class="mt-4 text-red-600 font-semibold text-sm">DISCLAIMER: For informational purposes only. Seek professional medical advice immediately.</p>
        </header>

        <div class="grid md:grid-cols-2 gap-8">
            
            <!-- Block 1: Symptom Checker -->
            <section class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
                <h2 class="text-xl font-bold mb-4 text-blue-700">1. Symptom Checker</h2>
                <div class="space-y-4">
                    <input type="text" id="symptomInput" placeholder="Describe your symptoms..." 
                        class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    <button onclick="checkSymptoms()" 
                        class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition">
                        Identify Medicine
                    </button>
                    <div id="results" class="mt-4 p-4 rounded-lg hidden bg-blue-50">
                        <!-- Results injected here -->
                    </div>
                </div>
            </section>

            <!-- Block 2: WhatsApp Reminder -->
            <section class="bg-white p-6 rounded-xl shadow-md border border-gray-200">
                <h2 class="text-xl font-bold mb-4 text-green-700">2. WhatsApp Reminder</h2>
                <p class="text-sm text-gray-600 mb-4">Set a reminder to take your medication via WhatsApp.</p>
                <div class="space-y-4">
                    <input type="text" id="medName" placeholder="Medicine Name" class="w-full p-3 border rounded-lg">
                    <input type="time" id="remindTime" class="w-full p-3 border rounded-lg">
                    <button onclick="setReminder()" 
                        class="w-full bg-green-600 text-white py-3 rounded-lg font-bold hover:bg-green-700 transition">
                        Schedule via WhatsApp
                    </button>
                </div>
            </section>

        </div>
    </div>

    <script>
        // Fetch data from your GitHub JSON
        async function checkSymptoms() {
            const query = document.getElementById('symptomInput').value.toLowerCase();
            const resultDiv = document.getElementById('results');
            
            if (!query) return;

            try {
                // Ensure data.json is in your repo and deployed to Vercel
                const response = await fetch('./data.json');
                const data = await response.json();
                
                // Simple search logic using 'text' column from your CSV
                const match = data.find(item => item.text.toLowerCase().includes(query));

                resultDiv.classList.remove('hidden');
                if (match) {
                    resultDiv.innerHTML = `
                        <p class="text-xs uppercase font-bold text-blue-500">Suggested Identification</p>
                        <h3 class="text-lg font-bold">${match.label}</h3>
                        <p class="text-sm mt-2 text-gray-700">${match.text}</p>
                    `;
                } else {
                    resultDiv.innerHTML = `<p class="text-sm text-gray-500 italic">No specific match found. Please consult a doctor.</p>`;
                }
            } catch (err) {
                console.error("Data fetch error:", err);
                resultDiv.innerHTML = `<p class="text-red-500 text-xs">Error loading database.</p>`;
            }
        }

        function setReminder() {
            const med = document.getElementById('medName').value;
            const time = document.getElementById('remindTime').value;
            if (!med || !time) return alert("Fill in details");

            const message = `Reminder: Please take your ${med} at ${time}.`;
            const encodedMsg = encodeURIComponent(message);
            
            // Opens WhatsApp with a pre-filled message
            window.open(`https://wa.me/?text=${encodedMsg}`, '_blank');
        }
    </script>
</body>
</html>
