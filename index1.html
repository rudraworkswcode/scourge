<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Symptom Checker</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f4f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 3rem 1rem;
      color: #1a1a18;
    }

    .app {
      background: #ffffff;
      border-radius: 16px;
      border: 0.5px solid rgba(0,0,0,0.12);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 680px;
      height: fit-content;
    }

    .app-title {
      font-family: 'DM Serif Display', serif;
      font-size: 32px;
      font-weight: 400;
      color: #1a1a18;
      margin-bottom: 4px;
    }

    .app-sub {
      font-size: 13px;
      color: #6b6b68;
      margin-bottom: 2rem;
      font-weight: 300;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .symptom-input {
      flex: 1;
      padding: 10px 14px;
      border: 0.5px solid rgba(0,0,0,0.25);
      border-radius: 8px;
      background: #fff;
      color: #1a1a18;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color 0.15s;
    }

    .symptom-input:focus { border-color: rgba(0,0,0,0.5); }

    .add-btn {
      padding: 10px 18px;
      border: 0.5px solid rgba(0,0,0,0.25);
      border-radius: 8px;
      background: transparent;
      color: #1a1a18;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .add-btn:hover { background: #f5f4f0; }

    .tags-area {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      min-height: 32px;
      margin-bottom: 1rem;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 10px;
      background: #f5f4f0;
      border: 0.5px solid rgba(0,0,0,0.12);
      border-radius: 999px;
      font-size: 13px;
      color: #1a1a18;
    }

    .tag-remove {
      cursor: pointer;
      color: #6b6b68;
      font-size: 15px;
      line-height: 1;
    }

    .tag-remove:hover { color: #1a1a18; }

    .quick-label {
      font-size: 12px;
      color: #6b6b68;
      margin-bottom: 6px;
    }

    .quick-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 1.5rem;
    }

    .chip {
      padding: 4px 10px;
      border: 0.5px solid rgba(0,0,0,0.15);
      border-radius: 999px;
      font-size: 12px;
      color: #6b6b68;
      cursor: pointer;
      background: transparent;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
    }

    .chip:hover {
      border-color: rgba(0,0,0,0.4);
      color: #1a1a18;
      background: #f5f4f0;
    }

    .diagnose-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #1a1a18;
      color: #ffffff;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s;
      margin-bottom: 2rem;
    }

    .diagnose-btn:hover { opacity: 0.85; }
    .diagnose-btn:disabled { opacity: 0.4; cursor: default; }

    .divider {
      border: none;
      border-top: 0.5px solid rgba(0,0,0,0.12);
      margin-bottom: 1.5rem;
    }

    .results-title {
      font-family: 'DM Serif Display', serif;
      font-size: 20px;
      font-weight: 400;
      color: #1a1a18;
      margin-bottom: 1rem;
    }

    .no-results {
      font-size: 14px;
      color: #6b6b68;
      padding: 1rem;
      text-align: center;
    }

    .disease-card {
      background: #ffffff;
      border: 0.5px solid rgba(0,0,0,0.12);
      border-radius: 12px;
      padding: 1rem 1.25rem;
      margin-bottom: 10px;
      cursor: pointer;
      transition: border-color 0.15s;
    }

    .disease-card:hover { border-color: rgba(0,0,0,0.25); }
    .disease-card.expanded { border-color: rgba(0,0,0,0.4); }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .card-name {
      font-size: 15px;
      font-weight: 500;
      color: #1a1a18;
    }

    .card-cat {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      font-weight: 400;
    }

    .cat-Respiratory    { background: #E6F1FB; color: #0C447C; }
    .cat-Digestive      { background: #EAF3DE; color: #27500A; }
    .cat-Infectious     { background: #FAEEDA; color: #633806; }
    .cat-Dermatological { background: #FBEAF0; color: #72243E; }
    .cat-Neurological   { background: #EEEDFE; color: #3C3489; }
    .cat-Endocrine      { background: #E1F5EE; color: #085041; }
    .cat-Cardiovascular { background: #FCEBEB; color: #791F1F; }
    .cat-Other          { background: #F1EFE8; color: #444441; }

    .score-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .score-dots { display: flex; gap: 3px; }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(0,0,0,0.15);
    }

    .dot.filled { background: #1a1a18; }

    .expand-icon {
      font-size: 12px;
      color: #6b6b68;
      margin-left: 4px;
    }

    .card-body {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 0.5px solid rgba(0,0,0,0.1);
      display: none;
    }

    .card-body.open { display: block; }

    .detail-label {
      font-size: 11px;
      font-weight: 500;
      color: #6b6b68;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 4px;
      margin-top: 10px;
    }

    .detail-label:first-child { margin-top: 0; }

    .detail-text {
      font-size: 13px;
      color: #1a1a18;
      line-height: 1.6;
    }

    .med-pill {
      display: inline-block;
      padding: 3px 8px;
      background: #f5f4f0;
      border: 0.5px solid rgba(0,0,0,0.12);
      border-radius: 999px;
      font-size: 12px;
      color: #1a1a18;
      margin: 2px 2px 2px 0;
    }

    .disclaimer {
      font-size: 11px;
      color: #6b6b68;
      border-top: 0.5px solid rgba(0,0,0,0.1);
      padding-top: 1rem;
      margin-top: 1.5rem;
      line-height: 1.6;
    }

    @media (max-width: 500px) {
      .app { padding: 1.5rem 1rem; }
      .app-title { font-size: 26px; }
    }
  </style>
</head>
<body>

<div class="app">
  <p class="app-title">Symptom Checker</p>
  <p class="app-sub">Enter your symptoms to see possible conditions and suggested medications.</p>

  <div class="input-row">
    <input class="symptom-input" id="symInput" type="text" placeholder="Type a symptom, e.g. fever, headache…" />
    <button class="add-btn" onclick="addSymptom()">+ Add</button>
  </div>

  <div class="tags-area" id="tagsArea"></div>

  <p class="quick-label">Common symptoms</p>
  <div class="quick-chips" id="quickChips"></div>

  <button class="diagnose-btn" id="diagnoseBtn" onclick="runDiagnosis()" disabled>Analyse symptoms</button>

  <div id="resultsSection" style="display:none;">
    <hr class="divider" />
    <p class="results-title" id="resultsTitle">Possible conditions</p>
    <div id="resultsList"></div>
    <p class="disclaimer">This tool is for informational purposes only and does not constitute medical advice. Always consult a qualified healthcare professional for diagnosis and treatment.</p>
  </div>
</div>

<script>
const DB = {
  "Common Cold":        { med: "Pseudoephedrine / Cetirizine",            symp: "Stuffy nose, sneezing, scratchy throat, and a mild cough.",                          cat: "Respiratory",    keywords: ["stuffy nose","sneezing","scratchy throat","mild cough"] },
  "Influenza (Flu)":    { med: "Oseltamivir (Tamiflu) / Acetaminophen",   symp: "High fever, body aches, extreme fatigue, and dry cough.",                           cat: "Respiratory",    keywords: ["high fever","body aches","extreme fatigue","dry cough","fever"] },
  "Bronchitis":         { med: "Guaifenesin / Bromhexine",                 symp: "Persistent cough with clear or yellow phlegm and chest discomfort.",                cat: "Respiratory",    keywords: ["persistent cough","phlegm","chest discomfort","cough"] },
  "Asthma":             { med: "Albuterol / Fluticasone",                  symp: "Shortness of breath, wheezing sounds, and chest tightness.",                        cat: "Respiratory",    keywords: ["shortness of breath","wheezing","chest tightness"] },
  "Pneumonia":          { med: "Amoxicillin / Azithromycin",               symp: "Deep cough, fever, chills, and difficulty breathing.",                              cat: "Respiratory",    keywords: ["deep cough","fever","chills","difficulty breathing","cough"] },
  "Sinusitis":          { med: "Fluticasone Propionate / Oxymetazoline",   symp: "Pressure behind the eyes, thick nasal discharge, and facial pain.",                 cat: "Respiratory",    keywords: ["pressure behind eyes","nasal discharge","facial pain","headache"] },
  "GERD (Acid Reflux)": { med: "Omeprazole / Antacids",                    symp: "Heartburn after eating and a sour or bitter taste in the mouth.",                   cat: "Digestive",      keywords: ["heartburn","sour taste","bitter taste","nausea"] },
  "Gastroenteritis":    { med: "Oral Rehydration Salts / Ondansetron",     symp: "Stomach cramps, watery diarrhea, and occasional vomiting.",                         cat: "Digestive",      keywords: ["stomach cramps","watery diarrhea","vomiting","nausea"] },
  "Peptic Ulcer":       { med: "Famotidine / Clarithromycin",              symp: "Burning stomach pain, feeling bloated, and intolerance to fatty foods.",             cat: "Digestive",      keywords: ["burning stomach pain","bloated","fatty food intolerance","nausea"] },
  "Irritable Bowel (IBS)": { med: "Hyoscyamine / Psyllium Husk",          symp: "Abdominal bloating, gas, and alternating constipation or diarrhea.",                 cat: "Digestive",      keywords: ["bloating","gas","constipation","diarrhea","stomach cramps"] },
  "Hepatitis":          { med: "Tenofovir / Interferon",                   symp: "Yellowish skin or eyes, dark urine, and intense fatigue.",                          cat: "Digestive",      keywords: ["yellow skin","yellow eyes","dark urine","fatigue","nausea"] },
  "Tuberculosis":       { med: "Rifampin / Isoniazid",                     symp: "Chronic cough with blood, night sweats, and weight loss.",                          cat: "Infectious",     keywords: ["chronic cough","blood in cough","night sweats","weight loss","cough","fatigue"] },
  "Dengue":             { med: "Acetaminophen (Paracetamol)",              symp: "Severe pain behind the eyes, high fever, and joint aches.",                         cat: "Infectious",     keywords: ["pain behind eyes","high fever","joint aches","fever","rash"] },
  "Malaria":            { med: "Artemether / Lumefantrine",                 symp: "Cyclical high fever, shaking chills, and profuse sweating.",                        cat: "Infectious",     keywords: ["cyclical fever","shaking chills","sweating","fever","fatigue"] },
  "Typhoid":            { med: "Ciprofloxacin / Ceftriaxone",              symp: "Sustained high fever, weakness, stomach pain, and headache.",                       cat: "Infectious",     keywords: ["sustained fever","weakness","stomach pain","headache","fever","fatigue"] },
  "Chickenpox":         { med: "Diphenhydramine / Acyclovir",              symp: "Itchy red blisters all over the body accompanied by a fever.",                      cat: "Infectious",     keywords: ["itchy blisters","red spots","fever","rash"] },
  "Eczema":             { med: "Hydrocortisone / Emollients",              symp: "Patches of skin that are dry, cracked, and extremely itchy.",                       cat: "Dermatological", keywords: ["dry skin","cracked skin","itchy skin","rash"] },
  "Psoriasis":          { med: "Tazarotene / Calcipotriene",               symp: "Red patches of skin covered with thick, silvery scales.",                           cat: "Dermatological", keywords: ["red patches","silvery scales","rash"] },
  "Acne Vulgaris":      { med: "Adapalene / Benzoyl Peroxide",             symp: "Persistent pimples, blackheads, and oily skin on the face or back.",                cat: "Dermatological", keywords: ["pimples","blackheads","oily skin","rash"] },
  "Migraine":           { med: "Sumatriptan / Naproxen",                   symp: "Throbbing headache on one side with light and sound sensitivity.",                  cat: "Neurological",   keywords: ["throbbing headache","light sensitivity","sound sensitivity","nausea","headache","dizziness"] },
  "Epilepsy":           { med: "Levetiracetam / Valproate",                symp: "Temporary confusion, staring spells, or uncontrollable jerking movements.",         cat: "Neurological",   keywords: ["confusion","staring spells","jerking movements"] },
  "Vertigo":            { med: "Meclizine / Betahistine",                  symp: "A sensation that the room is spinning, causing loss of balance.",                   cat: "Neurological",   keywords: ["spinning sensation","loss of balance","dizziness","nausea"] },
  "Diabetes Type 2":    { med: "Metformin / Insulin",                      symp: "Constant thirst, frequent urination, and blurred vision.",                          cat: "Endocrine",      keywords: ["thirst","frequent urination","blurred vision","fatigue"] },
  "Hypothyroidism":     { med: "Levothyroxine",                            symp: "Feeling cold all the time, weight gain, and thinning hair.",                        cat: "Endocrine",      keywords: ["feeling cold","weight gain","thinning hair","fatigue"] },
  "Hyperthyroidism":    { med: "Methimazole / Propylthiouracil",           symp: "Rapid heartbeat, sudden weight loss, and tremors in the hands.",                    cat: "Endocrine",      keywords: ["rapid heartbeat","weight loss","tremors"] },
  "Hypertension":       { med: "Lisinopril / Atenolol",                    symp: "Frequent morning headaches, nosebleeds, and irregular heart rhythms.",              cat: "Cardiovascular", keywords: ["morning headaches","nosebleeds","irregular heart rhythm","headache","dizziness"] },
  "Angina":             { med: "Nitroglycerin / Amlodipine",               symp: "Squeezing pain or pressure in the chest during physical activity.",                 cat: "Cardiovascular", keywords: ["chest pressure","chest pain during activity","chest pain","shortness of breath"] },
  "UTI":                { med: "Nitrofurantoin / Phenazopyridine",         symp: "Burning sensation when peeing and a constant urge to go.",                          cat: "Other",          keywords: ["burning urination","constant urge to pee","fever"] },
  "Anemia":             { med: "Ferrous Sulfate / B12",                    symp: "Pale skin, shortness of breath, and feeling cold or dizzy.",                        cat: "Other",          keywords: ["pale skin","shortness of breath","dizziness","fatigue"] },
  "Conjunctivitis":     { med: "Moxifloxacin / Olopatadine",              symp: "Redness in the white of the eye, itching, and crusty discharge.",                   cat: "Other",          keywords: ["red eyes","itchy eyes","crusty discharge"] }
};

const QUICK = ["fever","cough","headache","fatigue","nausea","dizziness","chest pain","shortness of breath","rash","vomiting"];

let symptoms = [];

function init() {
  const qc = document.getElementById('quickChips');
  QUICK.forEach(s => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.textContent = s;
    b.onclick = () => { document.getElementById('symInput').value = s; addSymptom(); };
    qc.appendChild(b);
  });
  document.getElementById('symInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') addSymptom();
  });
}

function addSymptom() {
  const inp = document.getElementById('symInput');
  const val = inp.value.trim().toLowerCase();
  if (!val || symptoms.includes(val)) { inp.value = ''; return; }
  symptoms.push(val);
  inp.value = '';
  renderTags();
  document.getElementById('diagnoseBtn').disabled = false;
  document.getElementById('resultsSection').style.display = 'none';
}

function removeSymptom(s) {
  symptoms = symptoms.filter(x => x !== s);
  renderTags();
  document.getElementById('diagnoseBtn').disabled = symptoms.length === 0;
  document.getElementById('resultsSection').style.display = 'none';
}

function renderTags() {
  const area = document.getElementById('tagsArea');
  area.innerHTML = symptoms.map(s =>
    `<span class="tag">${s}<span class="tag-remove" onclick="removeSymptom('${s.replace(/'/g,"\\'")}')">×</span></span>`
  ).join('');
}

function score() {
  const scores = {};
  symptoms.forEach(sym => {
    Object.entries(DB).forEach(([disease, info]) => {
      const allText = [...info.keywords, info.symp].join(' ').toLowerCase();
      if (allText.includes(sym)) {
        scores[disease] = (scores[disease] || 0) + 1;
      }
    });
  });
  return Object.entries(scores).sort((a, b) => b[1] - a[1]);
}

function runDiagnosis() {
  const results = score();
  const max = symptoms.length;
  const list = document.getElementById('resultsList');
  const title = document.getElementById('resultsTitle');

  if (results.length === 0) {
    list.innerHTML = '<p class="no-results">No matching conditions found. Try different or more specific symptoms.</p>';
  } else {
    title.textContent = `${results.length} possible condition${results.length !== 1 ? 's' : ''} found`;
    list.innerHTML = results.map(([name, sc]) => {
      const info = DB[name];
      const meds = info.med.split('/').map(m => `<span class="med-pill">${m.trim()}</span>`).join('');
      const dotCount = Math.min(max, 5);
      const dots = Array.from({ length: dotCount }, (_, i) =>
        `<span class="dot${i < sc ? ' filled' : ''}"></span>`
      ).join('');
      const key = name.replace(/[^a-z0-9]/gi, '_');
      return `
        <div class="disease-card" id="card-${key}" onclick="toggleCard('${name.replace(/'/g,"\\'")}')">
          <div class="card-header">
            <div class="card-left">
              <span class="card-name">${name}</span>
              <span class="card-cat cat-${info.cat}">${info.cat}</span>
            </div>
            <div class="score-badge">
              <div class="score-dots">${dots}</div>
              <span class="expand-icon" id="icon-${key}">&#9656;</span>
            </div>
          </div>
          <div class="card-body" id="body-${key}">
            <p class="detail-label">Symptoms</p>
            <p class="detail-text">${info.symp}</p>
            <p class="detail-label">Suggested medications</p>
            <p>${meds}</p>
            <p class="detail-text" style="margin-top:6px;font-size:12px;color:#6b6b68;">Consult a doctor before taking any medication.</p>
          </div>
        </div>`;
    }).join('');
  }
  document.getElementById('resultsSection').style.display = 'block';
}

function toggleCard(name) {
  const key = name.replace(/[^a-z0-9]/gi, '_');
  const body = document.getElementById('body-' + key);
  const icon = document.getElementById('icon-' + key);
  const card = document.getElementById('card-' + key);
  const isOpen = body.classList.contains('open');
  document.querySelectorAll('.card-body.open').forEach(el => el.classList.remove('open'));
  document.querySelectorAll('.expand-icon').forEach(el => el.innerHTML = '&#9656;');
  document.querySelectorAll('.disease-card.expanded').forEach(el => el.classList.remove('expanded'));
  if (!isOpen) {
    body.classList.add('open');
    icon.innerHTML = '&#9662;';
    card.classList.add('expanded');
  }
}

init();
</script>
</body>
</html>
